[project]
name = "perq"
version = "0.1.0"
description = "A TUI dashboard for your GitHub pull requests, with Claude Code summaries and reviews"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=1.0",
    "httpx>=0.27",
]

[project.scripts]
perq = "perq.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "textual-dev>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/perq"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
